name: Build filter list
permissions:
  contents: write
on:
  push:
    paths:
      - 'src/domains.txt'
  workflow_run:
    workflows: ["Clean Domains"]
    types:
      - completed

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7 

      - name: Run Script
        run: |
            cd src
            python build.py

      - name: Describe generated changes
        id: changes
        run: python src/commit_message.py build

      - name: Deploying filter list
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.changes.outputs.message }}
          file_pattern: 'adblock.txt adguard.txt README.md src/domains.txt'
          commit_author: Alexa <109213720+LexiMallow@users.noreply.github.com>
          commit_user_name: Alexa
          commit_user_email: 109213720+LexiMallow@users.noreply.github.com
          branch: master
